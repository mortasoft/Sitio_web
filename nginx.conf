server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esta línea es cláve para Single Page Applications (SPA):
        # Si no encuentra el archivo, devuelve index.html para que React Router maneje la ruta
        try_files $uri $uri/ /index.html;
    }

    # Caché opcional para archivos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
